<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>shareIT</title>

<style>

body {
    margin:0;
    font-family: Arial;
    background:#0f0f1a;
    color:white;
}

/* TOP BAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:#151525;
    position:sticky;
    top:0;
}

.logo{
    font-size:20px;
    font-weight:bold;
    color:#00ffd5;
}

button{
    cursor:pointer;
}

/* UPLOAD BUTTON */
.upload-btn{
    background:#00ffd5;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    font-weight:bold;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

/* CARD */
.card{
    background:#1c1c2e;
    border-radius:10px;
    padding:10px;
    overflow:hidden;
}

.card img, video{
    width:100%;
    border-radius:8px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.8);
}

.modal-content{
    background:#1c1c2e;
    width:300px;
    margin:100px auto;
    padding:20px;
    border-radius:10px;
}

.qr img{
    width:100%;
}

</style>
</head>

<body>

<div class="topbar">

<div class="logo">🚀 shareIT</div>

<button class="upload-btn" onclick="openModal()">
Select File
</button>

</div>

<!-- FILE GRID -->
<div class="grid" id="grid"></div>

<!-- MODAL -->
<div class="modal" id="modal">

<div class="modal-content">

<h3>Upload File</h3>

<input type="file" id="fileInput">

<br><br>

<button onclick="uploadFile()">
Share
</button>

<div class="qr" id="qrBox"></div>

</div>

</div>

<script>

const sessionId = "{{ session_id }}";

// OPEN MODAL
function openModal(){
    document.getElementById("modal").style.display="block";
}

// CLOSE WHEN CLICK OUTSIDE
window.onclick = function(e){
    if(e.target.id=="modal"){
        document.getElementById("modal").style.display="none";
    }
}

// UPLOAD FILE
function uploadFile(){

    let file = document.getElementById("fileInput").files[0];
    let formData = new FormData();
    formData.append("file", file);

    fetch(`/upload/${sessionId}`, {
        method:"POST",
        body:formData
    }).then(res=>res.json())
    .then(data=>{
        generateQR();
    });
}

// QR CODE AFTER UPLOAD
function generateQR(){
    document.getElementById("qrBox").innerHTML = `
        <p>Scan to view session</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${window.location.href}">
    `;
}

// LOAD FILES
function loadFiles(){

    fetch(`/files/${sessionId}`)
    .then(res=>res.json())
    .then(files=>{

        let grid = document.getElementById("grid");
        grid.innerHTML="";

        files.forEach(f=>{

            let ext = f.name.split(".").pop();

            let url = `/download/${sessionId}/${f.name}`;

            let html = "";

            if(["jpg","png","jpeg"].includes(ext)){
                html = `<img src="${url}">`;
            }
            else if(["mp4"].includes(ext)){
                html = `<video controls src="${url}"></video>`;
            }
            else if(["mp3"].includes(ext)){
                html = `
                    <audio controls src="${url}"></audio>
                    <a href="${url}" download>Download</a>
                `;
            }
            else{
                html = `<a href="${url}" download>Download File</a>`;
            }

            grid.innerHTML += `
                <div class="card">
                    ${html}
                </div>
            `;
        });
    });
}

// AUTO REFRESH EVERY SECOND
setInterval(loadFiles, 1000);

loadFiles();

</script>

</body>
</html>
